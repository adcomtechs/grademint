name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Install, lint, format, build, test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup reads the `packageManager` field in package.json
      # to determine the exact pnpm version — no version pin needed here.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint must pass with zero warnings — any console.* outside logger.js,
      # any boundary violation, or any code-quality issue is a CI failure.
      - name: Lint
        run: pnpm lint:ci

      # Formatting is enforced in CI so that developers cannot merge
      # unformatted code. Runs after lint so lint failures surface first.
      - name: Format check
        run: pnpm format:check

      # Coverage runs the full test suite and enforces the thresholds declared
      # in vitest.config.js. There is no separate "Test" step — running both
      # would execute the suite twice. Coverage is the single source of truth
      # for both test results and coverage metrics.
      - name: Coverage
        run: pnpm coverage

      # Build the production bundle. VITE_PUBLIC_ORIGIN is injected from
      # GitHub secrets so the build output contains the correct canonical
      # and Open Graph URLs — identical to what Netlify produces.
      - name: Build
        run: pnpm build
        env:
          VITE_PUBLIC_ORIGIN: ${{ secrets.VITE_PUBLIC_ORIGIN }}

      # Verify the build produced the expected HTML entry points.
      # Catches Rollup misconfigurations that exit 0 but emit no output.
      - name: Smoke test build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/docs.html  || (echo "dist/docs.html missing"  && exit 1)

      # Upload the dist/ directory so the exact artifact that passed CI
      # can be inspected or downloaded without re-running the build.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Runs only when code lands on main — not on pull requests.
  # This means every PR gets full CI validation but only merged code
  # triggers a real production deployment.
  deploy:
    name: Deploy to Netlify
    needs: verify
    runs-on: ubuntu-latest

    # Only deploy on pushes to main — never on pull requests.
    # PRs already get a Netlify deploy preview from the Netlify GitHub
    # integration, so this job handles production deploys only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Rebuild for deployment — identical to the verify job build but
      # kept separate so the deploy job is self-contained and can be
      # re-run independently if needed.
      - name: Build
        run: pnpm build
        env:
          VITE_PUBLIC_ORIGIN: ${{ secrets.VITE_PUBLIC_ORIGIN }}

      # Deploy the dist/ folder to Netlify production.
      # --prod flag promotes this deploy to the live production URL.
      # Without --prod, Netlify would create a draft deploy only.
      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=dist --message="Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

